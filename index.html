<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベトナム語通訳</title>
<meta name="description" content="日本語とベトナム語を、話すだけでその場で通訳して読み上げる会話アプリ。">
<meta name="theme-color" content="#ffd23f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="通訳">
<meta property="og:title" content="ベトナム語通訳 — Phiên dịch Nhật ⇄ Việt">
<meta property="og:description" content="日本語とベトナム語を、話すだけでその場で通訳して読み上げる会話アプリ。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen app — sunny header, polka-dot chat log with speaker badges, live "speech cloud", chunky candy buttons */
:root {
  --bg: #fff7ec; --dot: #ffe1ea; --surface: #ffffff; --ink: #2b2140; --muted: #6e6385; --line: #eadff5;
  --ja: #ff6b6b; --ja-deep: #d94848; --ja-soft: #ffe6e3;
  --vi: #1fb5a3; --vi-deep: #13897b; --vi-soft: #d6f5f0;
  --sun: #ffd23f; --sun-deep: #e0a800; --grape: #8c6cf2; --grape-deep: #6343d6; --grape-soft: #ece6ff;
  --f-ja: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --f-vi: "Nunito", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1830; --dot: #2a2344; --surface: #2a2340; --ink: #f6f0ff; --muted: #b9add3; --line: #3b3259;
  --ja: #ff7d7d; --ja-deep: #c24545; --ja-soft: #45263a;
  --vi: #36d1bd; --vi-deep: #1a8d7f; --vi-soft: #1b3d3f;
  --sun: #ffd23f; --sun-deep: #b98f00; --grape: #a88dff; --grape-deep: #6a4bd8; --grape-soft: #362c5c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1830; --dot: #2a2344; --surface: #2a2340; --ink: #f6f0ff; --muted: #b9add3; --line: #3b3259;
  --ja: #ff7d7d; --ja-deep: #c24545; --ja-soft: #45263a;
  --vi: #36d1bd; --vi-deep: #1a8d7f; --vi-soft: #1b3d3f;
  --sun: #ffd23f; --sun-deep: #b98f00; --grape: #a88dff; --grape-deep: #6a4bd8; --grape-soft: #362c5c; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100%; }
body { height: 100dvh; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-ja); display: flex; flex-direction: column;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 18%, transparent 19%), radial-gradient(var(--dot) 18%, transparent 19%);
  background-size: 34px 34px; background-position: 0 0, 17px 17px;
}
.wrap { width: 100%; max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header { background: var(--sun); border-bottom: 4px solid var(--sun-deep); color: #2b2140; }
header .wrap { padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.brand { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 42px; height: 42px; flex: none; border-radius: 14px; background: #fff; border: 3px solid #2b2140; display: flex; align-items: center; justify-content: center; gap: 1px; font-weight: 800; font-size: 15px; transform: rotate(-6deg); box-shadow: 3px 3px 0 #2b2140; }
.logo b { color: var(--ja-deep); } .logo i { font-style: normal; color: var(--vi-deep); font-family: var(--f-vi); }
h1 { font-size: 20px; font-weight: 800; margin: 0; line-height: 1.2; }
h1 small { display: block; font-family: var(--f-vi); font-weight: 700; font-size: 12px; opacity: .75; letter-spacing: .02em; }
.settings { min-width: 0; }
.settings summary { display: inline-block; list-style: none; cursor: pointer; font-weight: 800; font-size: 14px; background: #fff; color: #2b2140; border: 2px solid #2b2140; border-radius: 999px; padding: 6px 14px; box-shadow: 2px 2px 0 #2b2140; user-select: none; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::before { content: "▸ "; } .settings[open] summary::before { content: "▾ "; }
.settings[open] summary { margin-bottom: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select { font: inherit; cursor: pointer; color: inherit; max-width: 100%; }
select { min-width: 0; font-size: 13px; font-weight: 700; border-radius: 999px; border: 2px solid #2b2140; background: #fff; color: #2b2140; padding: 6px 10px; }
.field { min-width: 0; flex: 1 1 160px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 999px; border: 2px solid #2b2140; background: #fff; color: #2b2140; padding: 6px 12px; }
.field.wide { flex-basis: 260px; }
.field::placeholder { color: #8a7fa0; font-weight: 400; }
.chip-btn { font-size: 13px; font-weight: 700; border-radius: 999px; border: 2px solid #2b2140; background: #fff; color: #2b2140; padding: 5px 12px; }
body.big .turn .src { font-size: 18px; }
body.big .turn .dst { font-size: 28px; }
body.big #liveSrc { font-size: 18px; } body.big #liveDst { font-size: 24px; }
body.big .talk { font-size: 21px; } body.big #status { font-size: 15px; }
label.chk { display: flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 700; background: rgb(255 255 255 / .6); border-radius: 999px; padding: 5px 10px 5px 8px; }
label.chk input { accent-color: var(--grape); width: 16px; height: 16px; margin: 0; }
button:focus-visible, select:focus-visible, label.chk:focus-within { outline: 3px solid var(--grape); outline-offset: 2px; }

/* conversation */
main { flex: 1; overflow-y: auto; }
main .wrap { padding-block: 18px; display: flex; flex-direction: column; gap: 14px; }
.turn { position: relative; max-width: min(84%, 620px); border-radius: 22px; padding: 10px 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; border: 3px solid; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
.turn::before { position: absolute; top: -3px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; border: 3px solid var(--surface); }
.turn.from-ja { align-self: flex-start; margin-left: 44px; background: var(--ja-soft); border-color: var(--ja); border-top-left-radius: 6px; box-shadow: 0 4px 0 var(--ja); }
.turn.from-ja::before { content: "日"; left: -46px; background: var(--ja); }
.turn.from-vi { align-self: flex-end; margin-right: 44px; background: var(--vi-soft); border-color: var(--vi); border-top-right-radius: 6px; box-shadow: 0 4px 0 var(--vi); }
.turn.from-vi::before { content: "Vi"; right: -46px; background: var(--vi); font-family: var(--f-vi); }
.turn .src { font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.turn .dst { font-size: 21px; font-weight: 800; min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.vi-t { font-family: var(--f-vi); }
.turn .play { grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 3px solid currentColor; background: var(--surface); font-size: 15px; }
.turn.from-ja .play { color: var(--ja-deep); } .turn.from-vi .play { color: var(--vi-deep); }
.turn .play:hover { transform: scale(1.08); }
.turn.example { opacity: .7; box-shadow: none; border-style: dashed; animation: none; }
@keyframes pop { from { transform: scale(.8) translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }

/* live speech cloud */
.live .wrap { padding-block: 0 10px; }
.cloud { background: var(--surface); border: 3px dashed var(--grape); border-radius: 22px; padding: 8px 14px; min-height: 62px; display: flex; flex-direction: column; gap: 2px; }
.cloud .tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--grape); }
#liveSrc { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
#liveDst { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }

/* buttons */
.dock { background: var(--surface); border-top: 4px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { padding-block: 14px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.talk { min-width: 0; overflow-wrap: anywhere; border: none; color: #fff; border-radius: 22px; padding: 14px 10px 12px; font-size: 18px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .1s, box-shadow .1s, filter .2s; filter: saturate(.55) brightness(1.05); }
.talk small { font-weight: 700; font-size: 12px; opacity: .92; }
#talkJa { background: var(--ja); box-shadow: 0 6px 0 var(--ja-deep); }
#talkVi { background: var(--vi); box-shadow: 0 6px 0 var(--vi-deep); font-family: var(--f-vi); }
.talk:hover { filter: none; }
.talk:active { transform: translateY(5px); box-shadow: 0 1px 0 transparent !important; }
.talk.on, .talk.wait { filter: none; }
.talk.on { animation: bounce 1.2s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
#center { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--surface); background: var(--grape); color: #fff; box-shadow: 0 6px 0 var(--grape-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; font-weight: 800; transition: transform .1s, box-shadow .1s; }
#center b { font-size: 18px; line-height: 1; } #center small { font-size: 11px; font-family: var(--f-vi); font-weight: 700; opacity: .9; }
#center .mic { width: 14px; height: 20px; border: 3px solid currentColor; border-radius: 8px; margin-bottom: 2px; }
#center.running { background: var(--sun); color: #2b2140; box-shadow: 0 6px 0 var(--sun-deep); }
#center.running .sq { width: 20px; height: 20px; border-radius: 5px; background: #2b2140; margin-bottom: 3px; }
#center.auto-on { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 6px 0 var(--sun-deep), 0 0 0 0 color-mix(in srgb, var(--grape) 55%, transparent) } 50% { box-shadow: 0 6px 0 var(--sun-deep), 0 0 0 12px transparent } }
#center:active { transform: translateY(5px); box-shadow: 0 1px 0 transparent; }
#status { grid-column: 1 / -1; justify-self: center; text-align: center; font-size: 13px; font-weight: 700; color: var(--grape); background: var(--grape-soft); border-radius: 999px; padding: 4px 14px; }
#status.err { color: #fff; background: var(--ja-deep); }
@media (max-width: 520px) {
  header .wrap { padding-block: 10px; }
  .settings { width: 100%; } .settings summary { display: inline-block; }
  .controls select { flex: 1 1 140px; }
  .turn { margin-left: 40px; } .turn.from-vi { margin-left: 0; margin-right: 40px; }
  .turn .dst { font-size: 19px; }
  .dock .wrap { gap: 10px; padding-block: 12px 8px; }
  .talk { padding: 16px 6px 14px; border-radius: 20px; }
  #center { width: 74px; height: 74px; } #center b { font-size: 16px; }
  .turn { max-width: calc(100% - 44px); }
  .talk { font-size: 16px; }
  h1 { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .turn, .talk.on, #center.auto-on { animation: none } .talk.on { outline: 4px solid var(--sun); outline-offset: 2px } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo" aria-hidden="true"><b>日</b><i>V</i></div><h1>ベトナム語通訳<small>Phiên dịch Nhật ⇄ Việt</small></h1></div>
  <details class="settings" id="settings"><summary>設定 ・ Cài đặt</summary>
  <div class="controls">
    <select id="voiceVi" aria-label="ベトナム語の声"></select>
    <select id="voiceJa" aria-label="日本語の声"></select>
    <select id="rate" aria-label="読み上げ速度">
      <option value="0.9">ゆっくり</option><option value="1.1" selected>普通</option><option value="1.3">速い</option>
    </select>
    <label class="chk"><input type="checkbox" id="pingpong" checked> 交互に自動切替</label>
    <label class="chk"><input type="checkbox" id="auto" checked> 読み上げ</label>
    <label class="chk"><input type="checkbox" id="aiOn" checked> AI翻訳（やさしい表現）</label>
    <label class="chk"><input type="checkbox" id="bigText"> 大きい文字</label>
    <button type="button" class="chip-btn" id="clearLog">会話の履歴を消す</button>
    <input class="field" type="password" id="apiKey" placeholder="Claude APIキー" autocomplete="off" aria-label="Claude APIキー">
    <input class="field" type="password" id="azKey" placeholder="Azure 音声キー（自動判定）" autocomplete="off" aria-label="Azure 音声のキー">
    <input class="field" type="text" id="azRegion" placeholder="地域（例：japaneast）" aria-label="Azure 音声の地域">
    <input class="field wide" type="text" id="family" placeholder="家族メモ（例：日本語はパパ、ベトナム語はママ）" aria-label="家族メモ">
  </div>
  </details>
</div></header>

<main id="log"><div class="wrap" id="list">
  <div class="turn from-ja example">
    <div class="src">（例）はじめまして、田中です。</div>
    <div class="dst vi-t">Rất vui được gặp bạn, tôi là Tanaka.</div>
    <button class="play" data-text="Rất vui được gặp bạn, tôi là Tanaka." data-lang="vi" aria-label="もう一度再生">▶</button>
  </div>
  <div class="turn from-vi example">
    <div class="src vi-t">(Ví dụ) Rất vui được gặp anh. Tôi là Lan.</div>
    <div class="dst">お会いできてうれしいです。ランです。</div>
    <button class="play" data-text="お会いできてうれしいです。ランです。" data-lang="ja" aria-label="もう一度再生">▶</button>
  </div>
</div></main>

<div class="live"><div class="wrap"><div class="cloud">
  <div class="tag">いま話している内容 ・ ĐANG NÓI</div>
  <div id="liveSrc"></div>
  <div id="liveDst"></div>
</div></div></div>

<div class="dock"><div class="wrap">
  <button class="talk" id="talkJa">日本語で話す<small>Người Nhật</small></button>
  <button id="center" aria-label="自動で通訳を開始"></button>
  <button class="talk" id="talkVi">Nói tiếng Việt<small>ベトナム語</small></button>
  <div id="status">「自動」を押すと、話した言語を自動で見分けます ／ Bấm “Tự động” để bắt đầu</div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// a local server.js relays the online voice; on a public host the page talks to Google directly
const HAS_PROXY = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const L = {
  ja: { hear: 'ja-JP', say: 'ja-JP', cls: '', other: 'vi', btn: '#talkJa', listen: '日本語を聞いています…', voice: '#voiceJa' },
  vi: { hear: 'vi-VN', say: 'vi-VN', cls: 'vi-t', other: 'ja', btn: '#talkVi', listen: 'Đang nghe tiếng Việt…', voice: '#voiceVi' },
};
let active = false, autoOn = false, lang = 'ja', speaking = false, rec = null, voices = [];

function setStatus(t, err) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!err); }
function paintButtons(state) {
  const on = active || autoOn;
  for (const k of ['ja', 'vi']) {
    const b = $(L[k].btn);
    b.classList.toggle('on', on && k === lang && state === 'listen');
    b.classList.toggle('wait', on && k === lang && state !== 'listen');
  }
  paintCenter();
}
function paintCenter() {
  const c = $('#center'), running = active || autoOn;
  c.className = running ? 'running' + (autoOn ? ' auto-on' : '') : '';
  c.innerHTML = running ? '<span class="sq"></span><small>停止</small>' : '<span class="mic"></span><b>自動</b><small>Tự động</small>';
  c.setAttribute('aria-label', running ? '停止' : '自動で通訳を開始');
}

// ---- voices: Google online voice plus any installed ones, Microsoft AI voices first
function fillVoices(sel, code) {
  const prev = sel.value;
  const list = voices.filter(v => v.lang.toLowerCase().startsWith(code))
    .sort((a, b) => /natural/i.test(b.name) - /natural/i.test(a.name));
  sel.innerHTML = `<option value="azure">${code === 'vi' ? 'VI: AI音声 HoaiMy（Azure）' : 'JA: AI音声 Nanami（Azure）'}</option>` +
    `<option value="">${code === 'vi' ? 'VI' : 'JA'}: オンライン音声（Google）</option>`;
  for (const v of list) {
    const o = document.createElement('option'); o.value = v.name;
    o.textContent = `${code.toUpperCase()}: ` + (/natural/i.test(v.name) ? 'AI音声 ' : '') + v.name.replace(/Microsoft |Online \(Natural\) - .*$|Online \(Natural\)/g, '').trim();
    sel.append(o);
  }
  const hasAzure = !!$('#azKey').value.trim();
  if (prev && (list.some(v => v.name === prev) || (prev === 'azure' && hasAzure))) sel.value = prev;
  else if (hasAzure) sel.value = 'azure';
  else { const best = list.find(v => /natural/i.test(v.name)) || (HAS_PROXY ? null : list[0]); if (best) sel.value = best.name; }
}
function loadVoices() { voices = speechSynthesis.getVoices(); fillVoices($('#voiceVi'), 'vi'); fillVoices($('#voiceJa'), 'ja'); }
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

// ---- speech output
function chunks(text) {
  const out = []; let rest = text.trim();
  while (rest.length > 180) {
    let cut = Math.max(rest.lastIndexOf('. ', 180), rest.lastIndexOf(', ', 180), rest.lastIndexOf('。', 180), rest.lastIndexOf('、', 180));
    if (cut < 60) cut = rest.lastIndexOf(' ', 180);
    if (cut < 1) cut = 180;
    out.push(rest.slice(0, cut + 1)); rest = rest.slice(cut + 1).trim();
  }
  if (rest) out.push(rest);
  return out;
}
const player = new Audio();
player.referrerPolicy = 'no-referrer';
const ttsUrl = (q, code) => HAS_PROXY
  ? `/tts?tl=${code}&q=${encodeURIComponent(q)}`
  : `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${code}&q=${encodeURIComponent(q)}`;
async function speakOnline(text, code) {
  for (const part of chunks(text)) {
    if (!speaking) break;
    const ok = await new Promise(res => {
      player.src = ttsUrl(part, code);
      player.playbackRate = parseFloat($('#rate').value);
      player.onended = () => res(true); player.onerror = () => res(false);
      player.play().catch(() => res(false));
    });
    if (!ok && speaking) {
      // online voice unavailable: fall back to the phone's or PC's own voice
      const v = voices.find(v => v.lang.toLowerCase().startsWith(code));
      if (v) await speakSystem(part, v);
    }
  }
}
function speakSystem(text, v) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = parseFloat($('#rate').value);
    const guard = setTimeout(res, 4000 + text.length * 250);
    u.onend = u.onerror = () => { clearTimeout(guard); res(); };
    speechSynthesis.speak(u);
  });
}
const AZ_VOICES = { vi: 'vi-VN-HoaiMyNeural', ja: 'ja-JP-NanamiNeural' };
let azPlayer = null;
async function speakAzure(text, code) {
  az = az || await loadAzure();
  const cfg = az.SpeechConfig.fromSubscription($('#azKey').value.trim(), $('#azRegion').value.trim() || 'japaneast');
  const out = new az.SpeakerAudioDestination();
  azPlayer = out;
  const synth = new az.SpeechSynthesizer(cfg, az.AudioConfig.fromSpeakerOutput(out));
  const pct = Math.round((parseFloat($('#rate').value) - 1) * 100);
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ssml = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${L[code].say}"><voice name="${AZ_VOICES[code]}"><prosody rate="${pct >= 0 ? '+' : ''}${pct}%">${esc}</prosody></voice></speak>`;
  await new Promise((res, rej) => {
    const guard = setTimeout(res, 5000 + text.length * 300);
    const done = () => { clearTimeout(guard); res(); };
    out.onAudioEnd = done;
    synth.speakSsmlAsync(ssml, r => {
      synth.close();
      if (r.reason !== az.ResultReason.SynthesizingAudioCompleted) { clearTimeout(guard); rej(new Error(r.errorDetails || 'tts')); }
    }, e => { synth.close(); clearTimeout(guard); rej(new Error(e)); });
  });
  if (azPlayer === out) azPlayer = null;
}
async function speak(text, code) {
  shutUp(); speaking = true;
  const choice = $(L[code].voice).value;
  if (choice === 'azure' && $('#azKey').value.trim()) {
    try { await speakAzure(text, code); speaking = false; return; } catch { /* fall back below */ }
    if (!speaking) return;
  }
  const v = voices.find(v => v.name === choice);
  await (v ? speakSystem(text, v) : speakOnline(text, code));
  speaking = false;
}
function shutUp() {
  speaking = false; speechSynthesis.cancel(); player.pause(); player.onerror?.();
  if (azPlayer) { try { azPlayer.pause(); } catch {} azPlayer.onAudioEnd?.(azPlayer); azPlayer = null; }
}

// ---- translation (cached, so the live preview makes the final one instant)
const cache = new Map();
async function translate(q, sl, tl) {
  const key = sl + '|' + q;
  if (cache.has(key)) return cache.get(key);
  let out;
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(q)}`);
    if (!r.ok) throw 0;
    out = (await r.json())[0].map(p => p[0]).join('');
  } catch {
    const r = await fetch(`https://api.mymemory.translated.net/get?langpair=${sl}|${tl}&q=${encodeURIComponent(q)}`);
    out = (await r.json()).responseData.translatedText;
  }
  cache.set(key, out);
  return out;
}

// ---- natural translation with Claude (the key stays in this browser only)
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.132.1/+esm';
const SYSTEM = `You interpret a spoken conversation inside a family: one person speaks Japanese, the other speaks Vietnamese.
Translate the latest utterance into the other language the way a warm, caring family member would say it out loud: gentle, kind, natural spoken language, never stiff or word-for-word.
Japanese: soft everyday speech (for example 〜だよ, 〜してね, 〜かな). Avoid formal keigo unless the speaker is clearly being formal.
Vietnamese: choose natural family pronouns and particles (con, mẹ, bố, anh, em, ông, bà, nhé, nha, ạ for elders) from the family notes and the conversation so far; when unsure, use warm neutral wording.
Keep the meaning, the feeling and the amount of detail. Do not add new content, explanations or quotation marks.
The input comes from speech recognition and may contain small mistakes; translate what the speaker meant.
Reply with the translation only.`;
const NAMES = { ja: 'Japanese', vi: 'Vietnamese' };
const history = [];
let sdk = null, claude = null, claudeKey = '';
async function getClaude() {
  const key = $('#apiKey').value.trim();
  if (!key) return null;
  if (!sdk) sdk = (await import(SDK_URL)).default;
  if (!claude || claudeKey !== key) { claude = new sdk({ apiKey: key, dangerouslyAllowBrowser: true }); claudeKey = key; }
  return claude;
}
async function translateNatural(text, sl, tl) {
  const client = await getClaude();
  if (!client) return null;
  const family = $('#family').value.trim();
  const recent = history.slice(-6).map(t => `${NAMES[t.from]} speaker: ${t.src}`).join('\n');
  const prompt = (family ? `Family notes: ${family}\n\n` : '') +
    (recent ? `Conversation so far:\n${recent}\n\n` : '') +
    `Translate this ${NAMES[sl]} utterance into ${NAMES[tl]}:\n${text}`;
  const res = await client.beta.messages.create({
    model: 'claude-opus-5-5',
    max_tokens: 2000,
    betas: ['server-side-fallback-2026-07-01'],
    fallbacks: 'default',
    output_config: { effort: 'low' },
    system: SYSTEM,
    messages: [{ role: 'user', content: prompt }],
  });
  if (res.stop_reason === 'refusal') return null;
  const out = res.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
  return out || null;
}
function claudeError(e) {
  if (sdk && e instanceof sdk.AuthenticationError) return 'Claude APIキーが正しくありません。Google 翻訳を使いました。';
  if (sdk && e instanceof sdk.RateLimitError) return 'AI翻訳が混み合っています。Google 翻訳を使いました。';
  return 'AI翻訳に失敗したので、Google 翻訳を使いました。';
}

const LOG_KEY = 'vi-interp-log';
function saveLog() { try { localStorage.setItem(LOG_KEY, JSON.stringify(history.slice(-100))); } catch {} }
function restoreLog() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch {}
  for (const t of saved) { if (t && t.src && t.dst && L[t.from]) { history.push(t); addTurn(t.src, t.dst, t.from); } }
}

function addTurn(src, dst, from) {
  document.querySelectorAll('.turn.example').forEach(e => e.remove());
  const to = L[from].other;
  const d = document.createElement('div'); d.className = 'turn from-' + from;
  const s = document.createElement('div'); s.className = 'src ' + L[from].cls; s.textContent = src;
  const t = document.createElement('div'); t.className = 'dst ' + L[to].cls; t.textContent = dst;
  const b = document.createElement('button'); b.className = 'play'; b.textContent = '▶'; b.setAttribute('aria-label', 'もう一度再生');
  b.dataset.text = dst; b.dataset.lang = to;
  d.append(s, t, b); $('#list').append(d);
  $('#log').scrollTop = $('#log').scrollHeight;
}
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('.play'); if (!b) return;
  stopRec(); await speak(b.dataset.text, b.dataset.lang); if (active) listen(lang);
});

// ---- recognition
// Finals are held for a moment so a sentence with a short pause stays one turn.
const HOLD_MS = 700;
let pending = '', holdTimer = null, liveTimer = null, liveSeq = 0;

function stopRec() { if (rec) { rec.onend = rec.onresult = rec.onerror = null; try { rec.abort(); } catch {} rec = null; } }

function listen(code) {
  stopRec(); lang = code; pending = ''; clearTimeout(holdTimer);
  if (!active) return;
  const r = new SR(); rec = r;
  r.lang = L[code].hear; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) pending += (pending && code === 'vi' ? ' ' : '') + res[0].transcript.trim();
      else interim += res[0].transcript;
    }
    const shown = (pending + (interim ? (code === 'vi' && pending ? ' ' : '') + interim : '')).trim();
    showLive(shown, code);
    clearTimeout(holdTimer);
    if (pending && !interim) holdTimer = setTimeout(() => flush(code), HOLD_MS);
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopAll(); setStatus('マイクが許可されていません。アドレスバーの🔒からマイクを許可してください。', true); }
    else if (e.error === 'network') setStatus('音声認識にはインターネット接続が必要です。', true);
  };
  r.onend = () => { if (rec === r && active && !speaking) { try { r.start(); } catch {} } };
  try { r.start(); } catch {}
  paintButtons('listen'); setStatus(L[code].listen);
}

function showLive(text, code) {
  $('#liveSrc').textContent = text; $('#liveSrc').className = L[code].cls;
  $('#liveDst').className = L[L[code].other].cls;
  clearTimeout(liveTimer);
  if (!text) { $('#liveDst').textContent = ''; return; }
  const seq = ++liveSeq;
  liveTimer = setTimeout(async () => {
    try { const t = await translate(text, code, L[code].other); if (seq === liveSeq) $('#liveDst').textContent = t; } catch {}
  }, 250);
}

async function flush(code) {
  const text = pending.trim(); pending = '';
  if (!text || !active) return;
  stopRec();
  await processTurn(text, code);
  if (active && rec === null) listen($('#pingpong').checked ? L[code].other : code);
}

async function processTurn(text, code) {
  paintButtons('busy'); setStatus('翻訳中… / Đang dịch…');
  const to = L[code].other;
  try {
    let out = null, note = '';
    if ($('#aiOn').checked && $('#apiKey').value.trim()) {
      setStatus('やさしい表現に整えています… / Đang dịch…');
      try { out = await translateNatural(text, code, to); } catch (e) { note = claudeError(e); }
    }
    if (!out) out = await translate(text, code, to);
    history.push({ from: code, src: text, dst: out });
    saveLog();
    if (note) setStatus(note, true);
    liveSeq++; $('#liveSrc').textContent = ''; $('#liveDst').textContent = '';
    addTurn(text, out, code);
    if ($('#auto').checked) { setStatus(to === 'vi' ? 'Đang đọc…' : '読み上げ中…'); await speak(out, to); }
  } catch { setStatus('翻訳に失敗しました。インターネット接続を確認してください。', true); }
}

// ---- auto mode: Azure Speech hears both languages and tells which one was spoken
const AZ_URL = 'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js';
let az = null, autoRec = null, autoBusy = false, deafUntil = 0;
const autoQueue = [];
const codeOf = l => String(l || '').toLowerCase().startsWith('vi') ? 'vi' : 'ja';
// the mic also hears our own read-aloud, so results are dropped while speaking and just after
const deaf = () => speaking || Date.now() < deafUntil;
function loadAzure() {
  if (window.SpeechSDK) return Promise.resolve(window.SpeechSDK);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = AZ_URL; s.onload = () => res(window.SpeechSDK); s.onerror = () => rej(new Error('load'));
    document.head.append(s);
  });
}
function azError(details) {
  const d = String(details || '');
  if (/401|403|auth|subscription|key/i.test(d)) return 'Azure のキーか地域が正しくありません。設定を確認してください。';
  if (/microphone|permission|NotAllowed/i.test(d)) return 'マイクが許可されていません。アドレスバーの🔒からマイクを許可してください。';
  return '自動判定の音声認識が止まりました。インターネット接続を確認して、もう一度「自動」を押してください。';
}
const listeningMsg = () => '自動で聞いています。どちらの言葉でもどうぞ ／ Đang nghe, cứ nói tự nhiên nhé';
async function startAuto() {
  const key = $('#azKey').value.trim(), region = $('#azRegion').value.trim() || 'japaneast';
  if (!key) {
    $('#settings').open = true; $('#azKey').focus();
    setStatus('自動判定を使うには、設定に Azure 音声のキーを入れてください。言語ボタンならキーなしで使えます。', true);
    return;
  }
  unlockAudio(); stopManual(); shutUp();
  setStatus('準備しています… / Đang chuẩn bị…');
  try { az = await loadAzure(); } catch { setStatus('音声認識の読み込みに失敗しました。インターネット接続を確認してください。', true); return; }
  const cfg = az.SpeechConfig.fromSubscription(key, region);
  const detect = az.AutoDetectSourceLanguageConfig.fromLanguages(['ja-JP', 'vi-VN']);
  detect.mode = az.LanguageIdMode.Continuous;
  const r = az.SpeechRecognizer.FromConfig(cfg, detect, az.AudioConfig.fromDefaultMicrophoneInput());
  autoRec = r; autoOn = true;
  r.recognizing = (_, e) => {
    if (autoRec !== r || deaf() || autoBusy) return;
    const code = codeOf(az.AutoDetectSourceLanguageResult.fromResult(e.result).language);
    lang = code; paintButtons('listen'); showLive(e.result.text, code);
  };
  r.recognized = (_, e) => {
    if (autoRec !== r || deaf() || e.result.reason !== az.ResultReason.RecognizedSpeech) return;
    const text = (e.result.text || '').trim();
    if (!text) return;
    autoQueue.push({ text, code: codeOf(az.AutoDetectSourceLanguageResult.fromResult(e.result).language) });
    drainAuto();
  };
  r.canceled = (_, e) => {
    if (autoRec !== r || e.reason !== az.CancellationReason.Error) return;
    stopAll(); setStatus(azError(e.errorDetails), true);
  };
  paintButtons('listen'); setStatus(listeningMsg());
  r.startContinuousRecognitionAsync(() => {}, err => { if (autoRec === r) { stopAll(); setStatus(azError(err), true); } });
}
async function drainAuto() {
  if (autoBusy) return;
  autoBusy = true;
  while (autoOn && autoQueue.length) {
    const { text, code } = autoQueue.shift();
    lang = code;
    await processTurn(text, code);
    deafUntil = Date.now() + 600;
  }
  autoBusy = false;
  if (autoOn) { paintButtons('listen'); setStatus(listeningMsg()); }
}
function stopAuto() {
  const r = autoRec; autoRec = null; autoOn = false; autoQueue.length = 0;
  if (r) r.stopContinuousRecognitionAsync(() => r.close(), () => r.close());
}

let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch {}
  try { player.src = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq'; player.play().catch(() => {}); } catch {}
}
function stopManual() { active = false; stopRec(); clearTimeout(holdTimer); pending = ''; }
function begin(code) {
  unlockAudio(); stopAuto();
  if (!SR) { setStatus('このブラウザは音声認識に対応していません。Edge か Chrome で開いてください。', true); return; }
  shutUp(); active = true; listen(code);
}
function stopAll() {
  stopAuto(); stopManual(); shutUp();
  paintButtons(); $('#liveSrc').textContent = ''; $('#liveDst').textContent = '';
  setStatus('停止しました ／ Đã dừng');
}
// the center button starts auto mode (or stops whatever is running);
// a speaker button still hands the turn to that person in that language
$('#center').onclick = () => (active || autoOn) ? stopAll() : startAuto();
$('#talkJa').onclick = () => begin('ja');
$('#talkVi').onclick = () => begin('vi');
paintCenter();

for (const id of ['apiKey', 'family', 'azKey', 'azRegion']) {
  try { $('#' + id).value = localStorage.getItem('vi-interp-' + id) || ''; } catch {}
  $('#' + id).addEventListener('change', e => { try { localStorage.setItem('vi-interp-' + id, e.target.value.trim()); } catch {} });
}
$('#azKey').addEventListener('change', loadVoices);
try { $('#bigText').checked = localStorage.getItem('vi-interp-big') === '1'; } catch {}
document.body.classList.toggle('big', $('#bigText').checked);
$('#bigText').addEventListener('change', e => {
  document.body.classList.toggle('big', e.target.checked);
  try { localStorage.setItem('vi-interp-big', e.target.checked ? '1' : '0'); } catch {}
});
$('#clearLog').addEventListener('click', () => {
  if (!history.length || !confirm('これまでの会話をこの端末から消しますか？')) return;
  history.length = 0; saveLog();
  document.querySelectorAll('.turn:not(.example)').forEach(e => e.remove());
});
if (!location.hash.startsWith('#demo')) restoreLog();
loadVoices();

// #demo shows a sample family conversation (for screenshots); #demo-light / #demo-dark also pick the theme
if (location.hash.startsWith('#demo')) {
  const theme = location.hash.split('-')[1];
  if (theme) document.documentElement.dataset.theme = theme;
  addTurn('今日は寒いから、あったかくして出かけてね。', 'Hôm nay trời lạnh đó, em mặc ấm rồi hãy đi nhé.', 'ja');
  addTurn('Dạ, anh cũng nhớ quàng khăn nha.', 'うん、あなたもマフラー忘れないでね。', 'vi');
  addTurn('週末はみんなでフォーを食べに行こうか。', 'Cuối tuần cả nhà mình đi ăn phở nha?', 'ja');
  addTurn('Hay quá! Tụi nhỏ chắc vui lắm đó.', 'いいね！子どもたちもきっと大喜びだよ。', 'vi');
  lang = 'vi'; autoOn = true;
  $('#liveSrc').textContent = 'Anh ơi, mai mấy giờ mình đi?'; $('#liveSrc').className = 'vi-t';
  $('#liveDst').textContent = 'ねえ、明日は何時に出かける？'; $('#liveDst').className = '';
  paintButtons('listen'); setStatus(listeningMsg());
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
